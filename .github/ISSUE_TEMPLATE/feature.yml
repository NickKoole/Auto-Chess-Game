name: Feature
description: A new player-facing capability for an agent to build.
labels: ["type:feature", "state:backlog"]
body:
  - type: markdown
    attributes:
      value: |
        An agent builds this ticket with you sitting alongside it, so it can ask.
        Write it as if it could not: a ticket you have to explain from scratch in
        the session is one you had not finished thinking about. State the
        outcome, then the checks.

  - type: textarea
    id: outcome
    attributes:
      label: Outcome
      description: What can the player do afterwards that they couldn't before?
      placeholder: Players can lock the shop so its contents carry into the next round.
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Checkboxes an agent can verify. Each one should map to a test.
      value: |
        - [ ]
        - [ ]
        - [ ] xUnit tests cover the above in `server/tests/GameSim.Tests`
    validations:
      required: true

  - type: textarea
    id: design
    attributes:
      label: Design notes
      description: Constraints, formulas, edge cases, prior art — anything that stops the agent guessing.
    validations:
      required: false

  - type: textarea
    id: out-of-scope
    attributes:
      label: Out of scope
      description: Adjacent things the agent must NOT touch. This is the most useful box on the form — scope creep is far easier to prevent here than to unpick from a diff.
      placeholder: Don't rebalance existing unit costs. Don't change the save format.
    validations:
      required: false

  - type: dropdown
    id: area
    attributes:
      label: Area
      options: ["sim", "api", "client", "balance", "content", "infra"]
    validations:
      required: true

  - type: dropdown
    id: size
    attributes:
      label: Size
      description: "Pick l and the readiness check will tell you to split it."
      options: ["s", "m", "l"]
    validations:
      required: true
