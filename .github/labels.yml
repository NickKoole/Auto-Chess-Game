# Source of truth for the label taxonomy.
# Reconciled by .github/workflows/bootstrap-labels.yml (idempotent, safe to re-run).

# --- state: exactly one of these on an issue at any time ---
# Nothing on your machine watches these. `state:ready` is your shortlist when
# you sit down; `state:needs-you` is the machine saying it's your turn.
- name: "state:backlog"
  color: "9e9e9e"
  description: "Captured, not groomed."
- name: "state:ready"
  color: "0e8a16"
  description: "Groomed and buildable. Your shortlist."
- name: "state:building"
  color: "1d76db"
  description: "A dev agent run is in progress."
- name: "state:reviewing"
  color: "006b75"
  description: "A reviewer agent run is in progress."
- name: "state:needs-you"
  color: "d93f0b"
  description: "Machine is done. Your turn."
- name: "state:approved"
  color: "0e8a16"
  description: "You approved it. Ready to merge."
- name: "state:done"
  color: "ededed"
  description: "Merged and closed."
- name: "state:blocked"
  color: "000000"
  description: "Needs a decision or an external dependency."

# --- type ---
- name: "type:feature"
  color: "a2eeef"
  description: "New player-facing capability."
- name: "type:bug"
  color: "d73a4a"
  description: "Something behaves incorrectly."
- name: "type:chore"
  color: "fef2c0"
  description: "Tooling, refactor, deps, CI."
- name: "type:epic"
  color: "3e4b9e"
  description: "Parent ticket, split into children. Agents never build these."

# --- area: the dev agent uses this to decide which layer it may touch ---
- name: "area:sim"
  color: "c5def5"
  description: "server/src/GameSim - deterministic C# combat and idle maths."
- name: "area:api"
  color: "c5def5"
  description: "server/src/Api - endpoints, auth, EF Core persistence."
- name: "area:client"
  color: "c5def5"
  description: "client/ - Vue components, views, client state."
- name: "area:balance"
  color: "c5def5"
  description: "Tuning numbers, curves, drop tables."
- name: "area:content"
  color: "c5def5"
  description: "Units, traits, items, encounters."
- name: "area:infra"
  color: "c5def5"
  description: "Build, CI, automation, migrations tooling."

# --- size ---
- name: "size:s"
  color: "efefef"
  description: "Under ~150 lines of diff."
- name: "size:m"
  color: "efefef"
  description: "A few files, one subsystem."
- name: "size:l"
  color: "efefef"
  description: "Too broad for one unattended run. Split it."

# --- workflow control ---
- name: "split"
  color: "5319e7"
  description: "Add to an epic to generate its child tickets."
